name: Pull Request Validation

on:
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '18.x'
  ANGULAR_WEB_PATH: 'SampleAuthentication/angular-web'

jobs:
  validate:
    name: Validate PR
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: '${{ env.ANGULAR_WEB_PATH }}/package-lock.json'

    - name: Restore packages
      run: |
        nuget restore web/web.csproj -PackagesDirectory packages
        nuget restore DataContext/DataContext.csproj -PackagesDirectory packages
        dotnet restore API_Service/API_Service.csproj
        dotnet restore TestProject/TestProject.csproj

    - name: Build all projects
      run: |
        msbuild DataContext/DataContext.csproj /p:Configuration=Release
        msbuild web/web.csproj /p:Configuration=Release
        dotnet build API_Service/API_Service.csproj --configuration Release --no-restore

    - name: Run tests with coverage
      run: dotnet test TestProject/TestProject.csproj --configuration Release --logger "trx" --collect:"XPlat Code Coverage" /p:CollectCoverage=true

    - name: Install Angular dependencies
      working-directory: ${{ env.ANGULAR_WEB_PATH }}
      run: npm ci

    - name: Build Angular project
      working-directory: ${{ env.ANGULAR_WEB_PATH }}
      run: npm run build -- --configuration production

    - name: Run Angular tests with coverage
      working-directory: ${{ env.ANGULAR_WEB_PATH }}
      run: npm test -- --watch=false --code-coverage --browsers=ChromeHeadless

    - name: Code Coverage Summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      if: always()
      with:
        filename: '**/coverage.cobertura.xml'
        badge: true
        format: markdown
        output: both

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request' && always()
      with:
        recreate: true
        path: code-coverage-results.md

    - name: Check for vulnerabilities
      run: |
        dotnet list API_Service/API_Service.csproj package --vulnerable --include-transitive 2>&1 | tee vulnerability-report.txt
        if (Select-String -Path vulnerability-report.txt -Pattern "has the following vulnerable packages") { 
          Write-Warning "Vulnerabilities found!"
          exit 1 
        }
