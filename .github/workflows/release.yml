name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  ANGULAR_PROJECT_PATH: 'SampleAuthentication/angular-web'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Get version from tag
      id: get_version
      run: |
        $VERSION = "${{ github.ref_name }}".TrimStart('v')
        echo "version=$VERSION" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Restore and build all projects
      run: |
        nuget restore web/web.csproj -PackagesDirectory packages
        nuget restore DataContext/DataContext.csproj -PackagesDirectory packages
        dotnet restore API_Service/API_Service.csproj
        dotnet restore TestProject/TestProject.csproj
        msbuild DataContext/DataContext.csproj /p:Configuration=Release
        msbuild web/web.csproj /p:Configuration=Release
        dotnet build API_Service/API_Service.csproj --configuration Release --no-restore

    - name: Install Angular dependencies
      run: npm ci
      working-directory: ${{ env.ANGULAR_PROJECT_PATH }}

    - name: Run Angular tests
      run: npm test -- --watch=false --browsers=ChromeHeadless
      working-directory: ${{ env.ANGULAR_PROJECT_PATH }}

    - name: Build Angular
      run: npm run build -- --configuration production
      working-directory: ${{ env.ANGULAR_PROJECT_PATH }}

    - name: Run tests
      run: dotnet test TestProject/TestProject.csproj --configuration Release --no-build

    - name: Publish API Service
      run: dotnet publish API_Service/API_Service.csproj --configuration Release --output ./release/api

    - name: Publish Web MVC
      run: msbuild web/web.csproj /p:Configuration=Release /p:DeployOnBuild=true /p:PublishUrl=../release/web

    - name: Create release archives
      run: |
        Compress-Archive -Path ./release/api/* -DestinationPath api-service-${{ steps.get_version.outputs.version }}.zip
        Compress-Archive -Path ./release/web/* -DestinationPath web-mvc-${{ steps.get_version.outputs.version }}.zip
        Compress-Archive -Path ./${{ env.ANGULAR_PROJECT_PATH }}/dist/angular-web/* -DestinationPath angular-web-${{ steps.get_version.outputs.version }}.zip
      shell: pwsh

    - name: Generate Release Notes
      id: release_notes
      run: |
        $NOTES = @"
        ## Release ${{ steps.get_version.outputs.version }}
        
        ### What's Changed
        - JWT Authentication POC Release
        - ASP.NET Core Web API (.NET 8)
        - ASP.NET MVC Web Application (.NET Framework 4.8.1)
        - Angular Web Application (Angular 19)
        
        ### Deployment Instructions
        1. Download the appropriate artifact
        2. Extract to your deployment directory
        3. Configure appsettings.json / Web.config for .NET projects
        4. Deploy to IIS or Azure Web Apps
        5. For Angular, serve the dist output via a static host or reverse proxy
        
        **Full Changelog**: https://github.com/${{ github.repository }}/compare/....${{ github.ref_name }}
        "@
        echo "notes<<EOF" >> $env:GITHUB_OUTPUT
        echo $NOTES >> $env:GITHUB_OUTPUT
        echo "EOF" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ steps.get_version.outputs.version }}
        body: ${{ steps.release_notes.outputs.notes }}
        draft: false
        prerelease: false
        files: |
          api-service-${{ steps.get_version.outputs.version }}.zip
          web-mvc-${{ steps.get_version.outputs.version }}.zip
          angular-web-${{ steps.get_version.outputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
