name: Dependency Updates Check

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  ANGULAR_PROJECT_PATH: 'SampleAuthentication/angular-web'

permissions:
  issues: write

jobs:
  check-updates:
    name: Check for Outdated Packages
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Check outdated packages in API Service
      run: |
        dotnet list API_Service/API_Service.csproj package --outdated > api-outdated.txt
        Get-Content api-outdated.txt
      shell: pwsh
      continue-on-error: true

    - name: Check outdated packages in Test Project
      run: |
        dotnet list TestProject/TestProject.csproj package --outdated > test-outdated.txt
        Get-Content test-outdated.txt
      shell: pwsh
      continue-on-error: true

    - name: Check for vulnerabilities
      run: |
        dotnet list API_Service/API_Service.csproj package --vulnerable --include-transitive > api-vulnerabilities.txt
        dotnet list TestProject/TestProject.csproj package --vulnerable --include-transitive > test-vulnerabilities.txt
        Get-Content api-vulnerabilities.txt
        Get-Content test-vulnerabilities.txt
      shell: pwsh
      continue-on-error: true

    - name: Install Angular dependencies
      run: npm ci
      working-directory: ${{ env.ANGULAR_PROJECT_PATH }}

    - name: Check outdated Angular packages
      run: |
        npm outdated > angular-outdated.txt 2>&1
        Get-Content angular-outdated.txt
      shell: pwsh
      working-directory: ${{ env.ANGULAR_PROJECT_PATH }}
      continue-on-error: true

    - name: Check Angular vulnerabilities
      run: |
        npm audit --json > angular-vulnerabilities.txt 2>&1
        Get-Content angular-vulnerabilities.txt
      shell: pwsh
      working-directory: ${{ env.ANGULAR_PROJECT_PATH }}
      continue-on-error: true

    - name: Upload reports
      uses: actions/upload-artifact@v4
      with:
        name: dependency-reports
        path: |
          *-outdated.txt
          *-vulnerabilities.txt
          ${{ env.ANGULAR_PROJECT_PATH }}/angular-outdated.txt
          ${{ env.ANGULAR_PROJECT_PATH }}/angular-vulnerabilities.txt

    - name: Create Issue for Updates
      if: github.event_name == 'schedule'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const apiOutdated = fs.readFileSync('api-outdated.txt', 'utf8');
          const testOutdated = fs.readFileSync('test-outdated.txt', 'utf8');
          const apiVulnerabilities = fs.readFileSync('api-vulnerabilities.txt', 'utf8');
          const testVulnerabilities = fs.readFileSync('test-vulnerabilities.txt', 'utf8');
          const angularOutdated = fs.readFileSync('SampleAuthentication/angular-web/angular-outdated.txt', 'utf8');
          const angularVulnerabilities = fs.readFileSync('SampleAuthentication/angular-web/angular-vulnerabilities.txt', 'utf8');
          
          const body = `## Weekly Dependency Update Report
          
          ### API Service - Outdated Packages
          \`\`\`
          ${apiOutdated}
          \`\`\`
          
          ### Test Project - Outdated Packages
          \`\`\`
          ${testOutdated}
          \`\`\`
          
          ### API Service - Vulnerabilities
          \`\`\`
          ${apiVulnerabilities}
          \`\`\`
          
          ### Test Project - Vulnerabilities
          \`\`\`
          ${testVulnerabilities}
          \`\`\`
          
          ### Angular Web - Outdated Packages
          \`\`\`
          ${angularOutdated}
          \`\`\`
          
          ### Angular Web - Vulnerabilities
          \`\`\`
          ${angularVulnerabilities}
          \`\`\`
          
          ---
          *This issue was automatically created by the dependency update workflow.*`;
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Weekly Dependency Update Report - ${new Date().toISOString().split('T')[0]}`,
            body: body,
            labels: ['dependencies', 'automated']
          });
