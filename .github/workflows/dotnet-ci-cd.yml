name: .NET CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'SampleAuthentication/SampleAuthentication.slnx'
  API_PROJECT_PATH: 'SampleAuthentication/API_Service/API_Service.csproj'
  WEB_PROJECT_PATH: 'SampleAuthentication/web/web.csproj'
  DATA_CONTEXT_PATH: 'SampleAuthentication/DataContext/DataContext.csproj'
  TEST_PROJECT_PATH: 'SampleAuthentication/TestProject/TestProject.csproj'

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Setup .NET 8 for modern projects
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Setup MSBuild for .NET Framework projects
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Setup NuGet for .NET Framework package restoration
    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    # Restore NuGet packages for .NET Framework projects
    - name: Restore NuGet packages (.NET Framework)
      run: |
        nuget restore ${{ env.WEB_PROJECT_PATH }} -PackagesDirectory SampleAuthentication/packages
        nuget restore ${{ env.DATA_CONTEXT_PATH }} -PackagesDirectory SampleAuthentication/packages

    # Restore .NET 8 projects
    - name: Restore .NET 8 dependencies
      run: |
        dotnet restore ${{ env.API_PROJECT_PATH }}
        dotnet restore ${{ env.TEST_PROJECT_PATH }}

    # Build DataContext (.NET Framework 4.8)
    - name: Build DataContext
      run: msbuild ${{ env.DATA_CONTEXT_PATH }} /p:Configuration=Release /p:Platform=AnyCPU

    # Build Web (.NET Framework 4.8.1)
    - name: Build Web MVC Application
      run: msbuild ${{ env.WEB_PROJECT_PATH }} /p:Configuration=Release /p:Platform=AnyCPU

    # Build API Service (.NET 8)
    - name: Build API Service
      run: dotnet build ${{ env.API_PROJECT_PATH }} --configuration Release --no-restore
      
    # Build Test Project (.NET 8)
    - name: Build Test Project
      run: dotnet build ${{ env.TEST_PROJECT_PATH }} --configuration Release --no-restore

    # Run Tests
    - name: Run Unit Tests
      run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

    # Upload test results
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/TestResults/*.trx'

    # Upload code coverage
    - name: Upload Code Coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-coverage
        path: '**/TestResults/**/coverage.cobertura.xml'

    # Publish API Service
    - name: Publish API Service
      run: dotnet publish ${{ env.API_PROJECT_PATH }} --configuration Release --no-build --output ./publish/api

    # Publish Web MVC Application
    - name: Publish Web MVC Application
      run: msbuild ${{ env.WEB_PROJECT_PATH }} /p:Configuration=Release /p:Platform=AnyCPU /p:DeployOnBuild=true /p:WebPublishMethod=FileSystem /p:PublishUrl=publish/web /p:DeleteExistingFiles=true

    # Upload API artifacts
    - name: Upload API Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api-service
        path: ./publish/api

    # Upload Web artifacts
    - name: Upload Web Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: web-mvc
        path: ./publish/web

  code-quality:
    name: Code Quality Analysis
    runs-on: windows-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    # Restore all projects
    - name: Restore NuGet packages
      run: |
        nuget restore ${{ env.WEB_PROJECT_PATH }} -PackagesDirectory SampleAuthentication/packages
        nuget restore ${{ env.DATA_CONTEXT_PATH }} -PackagesDirectory SampleAuthentication/packages
        dotnet restore ${{ env.API_PROJECT_PATH }}
        dotnet restore ${{ env.TEST_PROJECT_PATH }}

    # Run .NET code analysis
    - name: Run .NET Code Analysis
      run: |
        dotnet build ${{ env.API_PROJECT_PATH }} --configuration Release --no-restore /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=false
        dotnet build ${{ env.TEST_PROJECT_PATH }} --configuration Release --no-restore /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=false

    # Run code metrics
    - name: Install dotnet-coverage tool
      run: dotnet tool install --global dotnet-coverage

    - name: Code Quality Summary
      run: echo "Code quality analysis completed successfully"

  security-scan:
    name: Security Vulnerability Scan
    runs-on: windows-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Run security vulnerability scan
    - name: Run Security Scan
      run: |
        dotnet list ${{ env.API_PROJECT_PATH }} package --vulnerable --include-transitive
        dotnet list ${{ env.TEST_PROJECT_PATH }} package --vulnerable --include-transitive