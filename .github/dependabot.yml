# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # .NET NuGet packages for API Service
  - package-ecosystem: "nuget"
    directory: "/API_Service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
      - "api-service"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  # .NET NuGet packages for Web MVC
  - package-ecosystem: "nuget"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
      - "web-mvc"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  # .NET NuGet packages for DataContext
  - package-ecosystem: "nuget"
    directory: "/DataContext"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
      - "data-context"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  # .NET NuGet packages for TestProject
  - package-ecosystem: "nuget"
    directory: "/TestProject"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
      - "testing"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  # npm packages for Angular Web
  - package-ecosystem: "npm"
    directory: "/SampleAuthentication/angular-web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
      - "angular"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci):"
      include: "scope"
